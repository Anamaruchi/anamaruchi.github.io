<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anamaruchi</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e8, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 700px;
      padding: 50px 40px;
      border-radius: 30px;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.35);
      text-align: center;
      position: relative;
    }

    h1 {
      color: #ff4f9a;
      font-size: clamp(28px, 5vw, 46px);
      margin-bottom: 40px;
    }

    .buttons {
      position: relative;
      height: 240px;
      width: 100%;
    }

    button {
      padding: 18px 45px;
      border: none;
      border-radius: 40px;
      font-size: clamp(18px, 3vw, 26px);
      cursor: pointer;
    }

    #yesBtn {
      background-color: #ff5fa2;
      color: white;
    }

    #noBtn {
      background-color: #ffc1da;
      color: #ff2f7a;
      position: absolute;
    }

    .hidden {
      display: none;
    }

    .result img {
      width: min(320px, 85%);
      border-radius: 25px;
      margin-top: 25px;
    }
  </style>
</head>
<body>

  <!-- DEFAULT: tampil ini dulu -->
  <div class="container" id="mobileBlock">
    <h1>Website ini cuma bisa dibuka di PC 💻</h1>
    <h1>Buka pakai laptop yaa 😌</h1>
  </div>

  <div class="container hidden" id="main">
    <h1>Hari Sabtu Jalan Yuk Novi ☺️</h1>
    <div class="buttons">
      <button id="yesBtn">YES ☺️</button>
      <button id="noBtn">NO 🙃</button>
    </div>
  </div>

  <div class="container hidden result" id="result">
    <h1>Yess kita jalan ya nanti 😆</h1>
    <img src="https://media1.tenor.com/m/WsWej1C3ePYAAAAd/yippee-cat-kitty.gif">
    <h1>Screenshot Jawabannya ke aku 😁</h1>
  </div>

  <script>
    const mobileBlock = document.getElementById("mobileBlock");
    const main = document.getElementById("main");
    const result = document.getElementById("result");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const area = document.querySelector(".buttons");

    function isMobile() {
      return window.innerWidth < 768;
    }

    function centerNoButton() {
      const x = (area.clientWidth - noBtn.offsetWidth) / 2;
      const y = (area.clientHeight - noBtn.offsetHeight) / 2;
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    function moveNoButton() {
      const maxX = area.clientWidth - noBtn.offsetWidth;
      const maxY = area.clientHeight - noBtn.offsetHeight;
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }

    window.addEventListener("load", () => {
      if (!isMobile()) {
        mobileBlock.classList.add("hidden");
        main.classList.remove("hidden");
        centerNoButton();
      }
    });

    noBtn.addEventListener("mouseenter", moveNoButton);

    yesBtn.addEventListener("click", () => {
      main.classList.add("hidden");
      result.classList.remove("hidden");
    });
  </script>

</body>
</html>
