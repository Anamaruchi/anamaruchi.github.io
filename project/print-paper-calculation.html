<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title data-i18n="doc_title">Anamaruchi - Print Paper Calculation</title>
<link rel="icon" type="image/x-icon" href="https://anamaruchi.web.id/Image/Anamaruchi.ico">
<style>
*, *::before, *::after {
    box-sizing: border-box;
}

html, body {
    min-height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    overflow-y: auto;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: clamp(5px, 2vw, 15px);
    padding-bottom: calc(clamp(5px, 2vw, 15px) + env(safe-area-inset-bottom, 0px));
    position: relative;
    box-sizing: border-box;
    -webkit-overflow-scrolling: touch;
}

.input-label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: bold;
    color: #3b82f6;
    text-align: left;
    text-transform: uppercase;
}

.home-button {
	position: fixed !important;
	top: clamp(10px, 2vw, 20px) !important;
	left: clamp(10px, 2vw, 20px) !important;
	background: linear-gradient(135deg, #0060df, #003eaa);
	color: white;
	border: none;
	padding: clamp(8px, 2vw, 12px);
	border-radius: 10px;
	cursor: pointer;
	transition: background-color 0.3s ease, box-shadow 0.3s ease;
	box-shadow: 0 5px 15px rgba(0, 96, 223, 0.3);
	z-index: 100;
	text-decoration: none;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: clamp(40px, 8vw, 50px);
	height: clamp(40px, 8vw, 50px);
	transform: none !important;
}

.home-button:hover {
    background: linear-gradient(135deg, #003eaa, #0060df);
    box-shadow: 0 8px 25px rgba(0, 96, 223, 0.4);
    transform: none !important;
}

.home-button:active {
	background: linear-gradient(135deg, #002080, #0060df);
	box-shadow: 0 4px 15px rgba(0, 96, 223, 0.5);
	transform: none !important;
}

.home-button:focus {
	outline: 2px solid rgba(255, 255, 255, 0.5);
	outline-offset: 2px;
	transform: none !important;
}

.home-icon {
    width: clamp(18px, 4vw, 24px);
    height: clamp(18px, 4vw, 24px);
    filter: brightness(0) invert(1);
    transition: none;
}

.lang-switcher-wrap{
  position: fixed;
  top: clamp(10px, 2vw, 20px);
  right: clamp(10px, 2vw, 20px);
  height: clamp(30px, 7vw, 34px);
  z-index: 1002;
}
.lang-switcher{
  position: relative;
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.lang-switcher-input{
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.lang-switcher-track{
  position: relative;
  width: clamp(72px, 16vw, 80px);
  height: clamp(30px, 7vw, 34px);
  background: linear-gradient(135deg, #0060df, #003eaa);
  border-radius: 999px;
  box-shadow: 0 5px 15px rgba(0, 96, 223, 0.3);
  transition: box-shadow 0.3s ease;
}
.lang-switcher:hover .lang-switcher-track{ box-shadow: 0 8px 25px rgba(0, 96, 223, 0.4); }
.lang-switcher:active .lang-switcher-track{ box-shadow: 0 4px 15px rgba(0, 96, 223, 0.5); }
.lang-switcher-input:focus-visible ~ .lang-switcher-track{ outline: 2px solid rgba(255,255,255,0.5); outline-offset: 2px; }
.lang-switcher-option{
  position: absolute;
  top: 0;
  width: 50%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: rgba(255,255,255,0.65);
  transition: color 0.3s ease;
  pointer-events: none;
}
.lang-switcher-option-en{ left: 0; color: #0060df; }
.lang-switcher-option-id{ right: 0; }
.lang-switcher-thumb{
  position: absolute;
  top: 3px;
  left: 3px;
  width: calc(50% - 6px);
  height: calc(100% - 6px);
  background: #fff;
  border-radius: 999px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  transition: transform 0.3s ease;
  z-index: 1;
}
.lang-switcher-input:checked ~ .lang-switcher-track .lang-switcher-thumb{
  transform: translateX(calc(100% + 6px));
}
.lang-switcher-input:checked ~ .lang-switcher-track .lang-switcher-option-en{ color: rgba(255,255,255,0.65); }
.lang-switcher-input:checked ~ .lang-switcher-track .lang-switcher-option-id{ color: #0060df; }

         .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #0060df, #003eaa);
            border: none;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 96, 223, 0.3);
            z-index: 100;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transform: translateY(100px);
        }

        .scroll-to-top.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-to-top:hover {
            background: linear-gradient(135deg, #003eaa, #0060df);
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 96, 223, 0.5);
        }

        .scroll-to-top.show:hover {
            transform: translateY(-5px) scale(1.1);
        }

        .scroll-to-top:active {
            transform: translateY(-2px) scale(1.05);
        }

        .scroll-to-top.show:active {
            transform: translateY(-2px) scale(1.05);
        }

        .go-up-icon {
            width: 28px;
            height: 28px;
            transition: all 0.3s ease;
        }

        .scroll-to-top:hover .go-up-icon {
            transform: scale(1.2) translateY(-2px);
        }
        
.main-wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: clamp(20px, 5vh, 60px);
    padding-bottom: clamp(20px, 5vh, 60px);
}

.calculator-container {
    width: 100%;
    max-width: 600px;
    padding: 20px;
    background: linear-gradient(135deg, rgba(26, 26, 26, 0.9), rgba(45, 45, 45, 0.9));
    backdrop-filter: blur(10px);
    border-radius: 30px;
    border: 3px solid rgba(59, 130, 246, 0.3);
    box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    transition: all 0.3s ease;
    animation: fadeInUp 1s ease-out;
    margin-bottom: clamp(20px, 5vh, 60px);
}

@keyframes fadeInUp {
    0% {
        opacity: 0;
        transform: translateY(30px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.calculator-container:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
}

h1 {
    text-align: center;
    color: #3b82f6;
    margin-top: 0;
    margin-bottom: 30px;
    border-bottom: 3px solid rgba(59, 130, 246, 0.5);
    padding-bottom: 15px;
    font-size: 2rem;
    text-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    font-weight: 600;
}

.input-row {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 10px;
}

input {
    width: 100%;
    padding: 9px 12px;
    font-size: 15px;
    font-weight: 400;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
    border: none;
    border-radius: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(59, 130, 246, 0.25);
    text-align: center;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.7);
    text-align: center;
}

input::-moz-placeholder {
    text-align: center;
    opacity: 1;
}

input:-ms-input-placeholder {
    text-align: center;
}

input::-ms-input-placeholder {
    text-align: center;
}

input:focus {
    outline: none;
    transform: translateY(-2px);
    box-shadow: 0 5px 16px rgba(59, 130, 246, 0.3);
}

.input-container {
    flex: 1 1 45%;
    min-width: min(250px, 100%);
}

.dropdown-container {
    position: relative;
    flex: 1 1 45%;
    min-width: min(250px, 100%);
}

.dropdown-btn {
    width: 100%;
    padding: 9px 12px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border: none;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
    border-radius: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(59, 130, 246, 0.25);
    font-weight: 400;
}

.dropdown-btn:hover {
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    transform: translateY(-2px);
    box-shadow: 0 5px 16px rgba(59, 130, 246, 0.3);
}

.dropdown-btn.active {
    background: linear-gradient(135deg, #1d4ed8, #3b82f6);
    transform: translateY(-2px);
    box-shadow: 0 5px 16px rgba(59, 130, 246, 0.3);
}

.dropdown-content {
    display: none;
    position: absolute;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    width: 100%;
    box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
    z-index: 1000;
    max-height: 200px;
    overflow-y: auto;
    border-radius: 8px;
    margin-top: 4px;
    backdrop-filter: blur(10px);
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events: none;
    border: 1px solid rgba(59, 130, 246, 0.5);
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}

.dropdown-content.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    z-index: 1000;
}

.dropdown-content div {
    color: white;
    padding: 12px;
    text-decoration: none;
    display: block;
    cursor: pointer;
    transition: background-color 0.15s ease;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.dropdown-content div:hover {
    background: rgba(255, 255, 255, 0.2);
}

.dropdown-content div:active {
    background: rgba(255, 255, 255, 0.3);
}

.dropdown-content div:first-child {
    border-radius: 8px 8px 0 0;
}

.dropdown-content div:last-child {
    border-radius: 0 0 8px 8px;
    border-bottom: none;
}

.dropdown-arrow {
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid white;
    display: inline-block;
    margin-left: 8px;
    transition: all 0.3s ease;
}

.dropdown-btn:hover .dropdown-arrow,
.dropdown-btn.active .dropdown-arrow {
    transform: scale(1.1);
}

.dropdown-btn.active .dropdown-arrow {
    transform: rotate(180deg);
}

.calculate-btn {
    width: 100%;
    padding: 10px;
    background: linear-gradient(135deg, #003eaa, #002080);
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(0, 96, 223, 0.25);
    font-weight: 500;
}

.calculate-btn:hover {
    background: linear-gradient(135deg, #002080, #003eaa);
    transform: translateY(-3px);
    box-shadow: 0 5px 16px rgba(0, 96, 223, 0.35);
}

.result-container {
    margin-top: 20px;
    padding: 15px;
    border: 1px solid rgba(59, 130, 246, 0.3);
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(29, 78, 216, 0.1));
    color: white;
    font-size: 18px;
    display: none;
    line-height: 1.8;
    text-align: left;
    overflow-x: auto;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    animation: slideUp 0.5s ease forwards;
}

@keyframes slideUp {
    0% {
        opacity: 0;
        transform: translateY(20px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

.result-container .result-row {
    display: flex;
    flex-wrap: wrap;
}

.result-container .result-label {
    font-weight: bold;
    white-space: nowrap;
    padding-right: 10px;
    color: #60a5fa;
}

.result-container .result-value {
    flex: 1;
    min-width: 150px;
}

.calculation-details {
    margin-top: 15px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.8);
    border-top: 1px dashed rgba(59, 130, 246, 0.3);
    padding-top: 5px;
    overflow-wrap: break-word;
    word-wrap: break-word;
    hyphens: auto;
}

.special-note {
    font-weight: bold;
    color: #4caf50;
    margin-top: 10px;
}

.credit-line {
    text-align: center;
    margin-top: 20px;
    font-size: clamp(0.7rem, 2.8vw, 1rem);
    font-weight: 600;
    color: #fff;
    border-top: 1px solid rgba(59, 130, 246, 0.3);
    padding-top: 15px;
    white-space: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.credit-line a {
    color: #60a5fa;
    text-decoration: none;
    transition: all 0.3s ease;
}

.credit-line a:hover {
    color: #90caf9;
    text-decoration: underline;
    text-shadow: 0 0 10px rgba(144, 202, 249, 0.5);
}

.paper-info-container {
    margin-top: 30px;
    padding: 15px;
    border: 1px solid rgba(59, 130, 246, 0.3);
    background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(29, 78, 216, 0.1));
    border-radius: 10px;
    backdrop-filter: blur(10px);
}

.paper-info-container h2 {
    text-align: center;
    color: #3b82f6;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.5rem;
    text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    font-weight: 600;
}

.paper-preview {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 20px;
}

.paper-container {
    position: relative;
    width: 280px;
    height: 200px;
    margin: 10px 0;
}

.paper-size {
    width: 100%;
    height: 100%;
    background: #cc0000;
    border-radius: 8px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #840000;
    padding: 2px;
}

.print-area {
    width: 100%;
    height: 100%;
    background: transparent;
    border-radius: 4px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
}

.finish-media-grid {
    width: 100%;
    height: 100%;
    display: grid;
    gap: 3px;
    padding: 0;
    background: #cc0000;
}

.finish-media-piece {
    background: #ffdd44;
    border-radius: 4px;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
    color: #333;
}

.legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
}

.legend-color {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    border: 1px solid rgba(255, 255, 255, 0.3);
}

@media (hover: none) {
    .dropdown-btn, .calculate-btn, .dropdown-content div, .credit-line a {
        cursor: default;
    }
    
    input, .calculate-btn, .dropdown-btn {
        font-size: 16px;
    }
}

@media screen and (max-width: 768px) {
    body {
        padding: 10px;
    }

    .main-wrapper {
        padding-top: clamp(15px, 3vh, 30px);
    }

    .calculator-container {
        backdrop-filter: none;
        background: rgba(26, 26, 26, 0.95);
        border-radius: 15px;
        padding: 15px;
        margin-bottom: calc(clamp(40px, 10vh, 90px) + env(safe-area-inset-bottom, 0px));
        max-width: 100%;
    }

    .dropdown-content {
        backdrop-filter: none;
        max-height: min(250px, 50vh);
        border: 2px solid rgba(59, 130, 246, 0.5);
    }

    .result-container {
        backdrop-filter: none;
        font-size: 16px;
    }

    h1 {
        font-size: 1.5rem;
        margin-bottom: 20px;
        padding-bottom: 10px;
    }

    .result-container .result-row {
        margin-bottom: 8px;
    }

    .result-container .result-label,
    .result-container .result-value {
        width: 100%;
        min-width: 100%;
    }

    .credit-line {
        padding-bottom: env(safe-area-inset-bottom, 10px);
    }

    .calculator-container:hover {
        transform: none;
        box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
    }

    .dropdown-btn:hover {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        transform: none;
        box-shadow: 0 3px 10px rgba(59, 130, 246, 0.25);
    }

    .dropdown-content div:hover {
        background: transparent;
    }

    input:focus {
        transform: none;
        box-shadow: 0 3px 10px rgba(59, 130, 246, 0.25);
    }

    .calculate-btn:hover {
        transform: none;
        box-shadow: 0 3px 10px rgba(0, 96, 223, 0.25);
    }
    
    .paper-container {
        width: 240px;
        height: 170px;
    }

    .legend {
        gap: 15px;
    }

    .legend-item {
        font-size: 12px;
    }
}

@media screen and (max-width: 480px) {
    .calculator-container {
        padding: 10px;
        border-radius: 10px;
    }

    h1 {
        font-size: 1.2rem;
    }

    input, .dropdown-btn {
        padding: 10px;
        font-size: 14px;
    }

    .calculate-btn {
        font-size: 16px;
    }

    .result-container {
        padding: 10px;
        font-size: 14px;
    }

    .calculation-details {
        font-size: 12px;
    }

    .dropdown-content {
        max-height: min(300px, 60vh);
        border-radius: 12px;
    }

    .dropdown-content div {
        padding: clamp(15px, 4vw, 18px);
        min-height: clamp(44px, 11vw, 52px);
        font-size: clamp(14px, 4vw, 16px);
    }
    
    .paper-container {
        width: 200px;
        height: 140px;
    }

    .legend {
        gap: 10px;
    }

    .legend-item {
        font-size: 11px;
    }

    .legend-color {
        width: 12px;
        height: 12px;
    }
}

@media screen and (max-width: 400px) {
    .input-row {
        gap: 12px;
    }

    .input-container,
    .dropdown-container {
        flex: 1 1 100%;
        min-width: 100%;
    }

    .home-button {
        width: clamp(36px, 9vw, 44px) !important;
        height: clamp(36px, 9vw, 44px) !important;
    }

    .scroll-to-top {
        width: clamp(40px, 11vw, 50px) !important;
        height: clamp(40px, 11vw, 50px) !important;
    }

    h1 {
        font-size: 1.1rem;
    }

    .paper-container {
        width: 170px;
        height: 120px;
    }

    .legend {
        gap: 8px;
    }

    .legend-item {
        font-size: 10px;
    }

    .calculation-details {
        font-size: 11px;
    }
}

@media screen and (max-width: 340px) {
    body {
        padding: 8px;
    }

    .calculator-container {
        padding: 8px;
    }

    h1 {
        font-size: 1rem;
    }

    input,
    .dropdown-btn {
        padding: 8px;
        font-size: 13px;
    }

    .paper-container {
        width: 140px;
        height: 100px;
    }

    .legend {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }
}

@media screen and (max-height: 600px) and (orientation: landscape) {
    .main-wrapper {
        padding-top: clamp(10px, 3vh, 20px);
        padding-bottom: clamp(10px, 3vh, 20px);
    }

    .calculator-container {
        margin-bottom: clamp(20px, 6vh, 40px);
    }

    .home-button {
        top: 8px !important;
    }

    .scroll-to-top {
        bottom: 8px !important;
    }
}

@supports (-webkit-touch-callout: none) {
    body {
        min-height: -webkit-fill-available;
    }

    .main-wrapper {
        min-height: -webkit-fill-available;
    }
}

* {
    max-width: 100%;
}

h1, p, span, div, li, input, button {
    word-wrap: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
}
</style>
</head>
<body>
<a href="https://anamaruchi.web.id/" class="home-button" id="homeButton">
<img src="https://anamaruchi.web.id/Image/Home Icon.png" alt="Home" />
</a>

<div class="lang-switcher-wrap">

<script>
var __i18nDict = null;
var __i18nLang = 'en';
var refreshDynamicI18nText = null;
function t(key, fallback){
  var dict = (__i18nDict && __i18nDict[__i18nLang]) ? __i18nDict[__i18nLang] : null;
  if(dict && Object.prototype.hasOwnProperty.call(dict, key)) return dict[key];
  return fallback !== undefined ? fallback : key;
}

function getPrintSideLabel(value){
  if(value === '1 Side') return t('print_side_1', '1 Side');
  if(value === '2 Side') return t('print_side_2', '2 Side');
  return value;
}

let selectedFinishMedia = '';
let selectedPrintSide = '';
let selectedPaperSize = '';

let isDropdownOpen = false;
let dropdownCloseTimers = {};

function setupScrollToTop() {
    let isScrolling = false;

    function checkScrollPosition() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        
        if (scrollTop > 300) {
            document.getElementById('scrollToTop').classList.add('show');
        } else {
            document.getElementById('scrollToTop').classList.remove('show');
        }
    }

    window.addEventListener('scroll', function() {
        if (!isScrolling) {
            requestAnimationFrame(function() {
                checkScrollPosition();
                isScrolling = false;
            });
            isScrolling = true;
        }
    });

    document.getElementById('scrollToTop').addEventListener('click', function(e) {
        e.preventDefault();
        
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

        setTimeout(function() {
            checkScrollPosition();
        }, 100);
    });

    checkScrollPosition();
}

function isMobileDevice() {
    return (window.innerWidth <= 768);
}

function adjustForMobile() {
    if (isMobileDevice()) {
        window.addEventListener('scroll', function() {
            closeAllDropdowns();
        });
        
        const dropdowns = document.getElementsByClassName("dropdown-content");
        for (let i = 0; i < dropdowns.length; i++) {
            dropdowns[i].style.maxHeight = (window.innerHeight * 0.4) + "px";
        }
    }
}

function closeAllDropdowns() {
    const dropdowns = document.getElementsByClassName("dropdown-content");
    for (let i = 0; i < dropdowns.length; i++) {
        const openDropdown = dropdowns[i];
        if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
            
            if (dropdownCloseTimers[openDropdown.id]) {
                clearTimeout(dropdownCloseTimers[openDropdown.id]);
            }
            dropdownCloseTimers[openDropdown.id] = setTimeout(function() {
                openDropdown.style.display = 'none';
            }, 200);
        }
    }
    
    const dropdownBtns = document.getElementsByClassName("dropdown-btn");
    for (let i = 0; i < dropdownBtns.length; i++) {
        dropdownBtns[i].classList.remove('active');
    }
    
    isDropdownOpen = false;
}

function toggleDropdown(dropdownId) {
    try {
        const dropdown = document.getElementById(dropdownId);
        if (!dropdown) {
            console.error('Dropdown not found:', dropdownId);
            return;
        }
        
        const btn = dropdown.previousElementSibling;
        if (!btn) {
            console.error('Button not found for dropdown:', dropdownId);
            return;
        }
        
        if (dropdown.classList.contains('show')) {
            dropdown.classList.remove('show');
            btn.classList.remove('active');
            isDropdownOpen = false;
            
            if (dropdownCloseTimers[dropdownId]) {
                clearTimeout(dropdownCloseTimers[dropdownId]);
            }
            dropdownCloseTimers[dropdownId] = setTimeout(function() {
                dropdown.style.display = 'none';
            }, 200);
        } else {
            closeAllDropdowns();
            
            if (dropdownCloseTimers[dropdownId]) {
                clearTimeout(dropdownCloseTimers[dropdownId]);
                dropdownCloseTimers[dropdownId] = null;
            }
            
            dropdown.style.display = 'block';
            void dropdown.offsetWidth;
            
            dropdown.classList.add('show');
            btn.classList.add('active');
            isDropdownOpen = true;
        }
    } catch (error) {
        console.error('Error in toggleDropdown:', error);
    }
}

function selectOption(type, value) {
    try {
        if (type === 'finishMedia') {
            selectedFinishMedia = value;
            const btn = document.getElementById('finishMediaBtn');
            if (btn) {
                btn.innerHTML = value + ' <span class="dropdown-arrow"></span>';
            }
        } else if (type === 'printSide') {
            selectedPrintSide = value;
            const btn = document.getElementById('printSideBtn');
            if (btn) {
                btn.innerHTML = getPrintSideLabel(value) + ' <span class="dropdown-arrow"></span>';
            }
        } else if (type === 'paperSize') {
            selectedPaperSize = value;
            const btn = document.getElementById('paperSizeBtn');
            if (btn) {
                btn.innerHTML = value + ' <span class="dropdown-arrow"></span>';
            }
        }
        
        closeAllDropdowns();
    } catch (error) {
        console.error('Error in selectOption:', error);
    }
}

function updatePaperPreview() {
    try {
        const grid = document.getElementById('finishMediaGrid');
        if (!grid) {
            console.error('Finish media grid not found');
            return;
        }
        
        const printArea = document.querySelector('.print-area');
        if (!printArea) {
            console.error('Print area not found');
            return;
        }
        
        const paperSizeLegend = document.getElementById('paperSizeLegend');
        const printAreaLegend = document.getElementById('printAreaLegend');
        const finishMediaLegend = document.getElementById('finishMediaLegend');
        
        if (!selectedFinishMedia || !selectedPaperSize) {
            grid.innerHTML = '<div style="color: rgba(255,255,255,0.5); text-align: center; font-size: 12px;">' + t('preview_placeholder', 'Click Calculate to see preview') + '</div>';
            if (paperSizeLegend) paperSizeLegend.style.display = 'flex';
            if (printAreaLegend) printAreaLegend.style.display = 'none';
            if (finishMediaLegend) finishMediaLegend.querySelector('span').textContent = t('finish_media_word', 'Finish Media');
            return;
        }
        
        let pieces = 1;
        let gridCols = 1;
        let gridRows = 1;
        
        const validFinishMedia = selectedFinishMedia === 'A4/B5/Quarto' || selectedFinishMedia === 'A5/B6' || selectedFinishMedia === 'A6';
        const validPaperSizes = selectedPaperSize.includes('A3 [42x29,7cm]') || selectedPaperSize.includes('A4 [29,7x21cm]');
        const useNewDesign = validFinishMedia && validPaperSizes;
        const isA3Plus = selectedPaperSize.includes('A3+ [31,5x47,5cm]');
        
        if (validPaperSizes) {
            if (paperSizeLegend) paperSizeLegend.style.display = 'flex';
            if (printAreaLegend) printAreaLegend.style.display = 'none';
            if (finishMediaLegend) finishMediaLegend.querySelector('span').textContent = t('legend_available_print_area', 'Available Print Area');
        } else if (isA3Plus) {
            if (paperSizeLegend) paperSizeLegend.style.display = 'flex';
            if (printAreaLegend) printAreaLegend.style.display = 'flex';
            if (finishMediaLegend) finishMediaLegend.querySelector('span').textContent = t('finish_media_word', 'Finish Media');
        } else {
            if (paperSizeLegend) paperSizeLegend.style.display = 'flex';
            if (printAreaLegend) printAreaLegend.style.display = 'none';
            if (finishMediaLegend) finishMediaLegend.querySelector('span').textContent = t('finish_media_word', 'Finish Media');
        }
        
        if (selectedFinishMedia === 'A4/B5/Quarto') {
            if (selectedPaperSize.includes('A4')) {
                pieces = 1;
                gridCols = 1;
                gridRows = 1;
            } else if (selectedPaperSize.includes('A3')) {
                pieces = 2;
                gridCols = 2;
                gridRows = 1;
            }
        } else if (selectedFinishMedia === 'A5/B6') {
            if (selectedPaperSize.includes('A4')) {
                pieces = 2;
                gridCols = 2;
                gridRows = 1;
            } else if (selectedPaperSize.includes('A3')) {
                pieces = 4;
                gridCols = 2;
                gridRows = 2;
            }
        } else if (selectedFinishMedia === 'A6') {
            if (selectedPaperSize.includes('A4')) {
                pieces = 4;
                gridCols = 2;
                gridRows = 2;
            } else if (selectedPaperSize.includes('A3')) {
                pieces = 8;
                gridCols = 4;
                gridRows = 2;
            }
        }
        
        if (useNewDesign) {
            printArea.style.width = '100%';
            printArea.style.height = '100%';
            printArea.style.background = 'transparent';
            printArea.style.border = 'none';
            printArea.style.padding = '2px';
            
            grid.style.width = '100%';
            grid.style.height = '100%';
            grid.style.gap = '2px';
            grid.style.padding = '0';
            grid.style.background = '#cc0000';
        } else {
            printArea.style.width = '95%';
            printArea.style.height = '95%';
            printArea.style.background = '#4488ff';
            printArea.style.border = '2px solid #2266cc';
            printArea.style.padding = '8px';
            
            grid.style.width = '95%';
            grid.style.height = '95%';
            grid.style.gap = '2px';
            grid.style.padding = '4px';
            grid.style.background = 'transparent';
        }
        
        grid.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
        grid.style.gridTemplateRows = `repeat(${gridRows}, 1fr)`;
        
        grid.innerHTML = '';
        for (let i = 0; i < pieces; i++) {
            const piece = document.createElement('div');
            piece.className = 'finish-media-piece';
            
            if (useNewDesign) {
                piece.style.background = '#ffdd44';
                piece.style.border = 'none';
                piece.style.borderRadius = '4px';
                piece.textContent = i + 1;
                piece.style.fontSize = '12px';
                piece.style.fontWeight = 'bold';
                piece.style.color = '#333';
            } else {
                piece.style.background = '#ffdd44';
                piece.style.border = '1px solid #ccaa00';
                piece.style.borderRadius = '2px';
                piece.textContent = i + 1;
            }
            
            grid.appendChild(piece);
        }
    } catch (error) {
        console.error('Error in updatePaperPreview:', error);
    }
}

function formatRoundingText(rawValue, roundedValue) {
    if (Math.ceil(rawValue) === rawValue) {
        return `= ${roundedValue}`;
    } else {
        return `= ${rawValue} > ${t('calc_rounded_to', 'rounded to')} ${roundedValue}`;
    }
}

function calculate() {

        const totalPages = parseInt(document.getElementById('totalPages').value) || 0;
        let qtyTotal = parseInt(document.getElementById('qtyTotal').value) || 0;

            alert(t('alert_invalid_values', 'Please enter valid values for Total Of Page and Qty Total'));
            return;
        }
        
        if (!selectedFinishMedia || !selectedPrintSide || !selectedPaperSize) {
            alert(t('alert_select_options', 'Please select all options'));
            return;

document.addEventListener('DOMContentLoaded', function() {
    try {
        console.log('DOM fully loaded');
        
        document.getElementById('finishMediaBtn').addEventListener('click', function() {
            toggleDropdown('finishMediaDropdown');
        });
        
        document.getElementById('printSideBtn').addEventListener('click', function() {
            toggleDropdown('printSideDropdown');
        });
        
        document.getElementById('paperSizeBtn').addEventListener('click', function() {
            toggleDropdown('paperSizeDropdown');
        });
        
        const finishMediaOptions = document.querySelectorAll('#finishMediaDropdown div');
        finishMediaOptions.forEach(option => {
            option.addEventListener('click', function() {
                selectOption('finishMedia', this.getAttribute('data-value'));
            });
        });
        
        const printSideOptions = document.querySelectorAll('#printSideDropdown div');
        printSideOptions.forEach(option => {
            option.addEventListener('click', function() {
                selectOption('printSide', this.getAttribute('data-value'));
            });
        });
        
        const paperSizeOptions = document.querySelectorAll('#paperSizeDropdown div');
        paperSizeOptions.forEach(option => {
            option.addEventListener('click', function() {
                selectOption('paperSize', this.getAttribute('data-value'));
            });
        });
        
        document.getElementById('calculateBtn').addEventListener('click', calculate);
        
        document.addEventListener('click', function(event) {
            if (!event.target.closest('.dropdown-btn') && 
                !event.target.closest('.dropdown-content')) {
                closeAllDropdowns();
            }
        });

        document.addEventListener('touchstart', function(event) {
            if (!event.target.closest('.dropdown-container')) {
                closeAllDropdowns();
            }
        });
        
        setupScrollToTop();
        adjustForMobile();
        
        window.addEventListener('resize', adjustForMobile);
        window.addEventListener('orientationchange', function() {
            setTimeout(adjustForMobile, 200);
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isDropdownOpen) {
                closeAllDropdowns();
            }
        });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                if (!event.target.closest('.dropdown-content')) {
                    event.preventDefault();
                }
            }
            lastTouchEnd = now;
        }, false);
        
        console.log('Initialization complete');
    } catch (error) {
        console.error('Error during initialization:', error);
    }
});

refreshDynamicI18nText = function(){
  try{
    if(selectedPrintSide){
      var printSideBtn = document.getElementById('printSideBtn');
      if(printSideBtn){
        printSideBtn.innerHTML = getPrintSideLabel(selectedPrintSide) + ' <span class="dropdown-arrow"></span>';
      }
    }
    updatePaperPreview();
    var resultContainer = document.getElementById('resultContainer');
    if(resultContainer && resultContainer.style.display === 'block'){
      calculate();
    }
  }catch(e){
    console.warn('i18n: refreshDynamicI18nText failed.', e);
  }
};

(function(){
  "use strict";

  var LANG_STORAGE_KEY = 'anamaruchi_print_paper_lang';
  var DEFAULT_LANG = 'en';

  var langSwitcher = document.getElementById('langSwitcher');

  function getSavedLang(){
    try{
      var saved = localStorage.getItem(LANG_STORAGE_KEY);
      if(saved === 'en' || saved === 'id') return saved;
    }catch(e){}
    return DEFAULT_LANG;
  }

  function saveLang(lang){
    try{ localStorage.setItem(LANG_STORAGE_KEY, lang); }catch(e){}
  }

  function applyTranslations(lang){
    if(!__i18nDict || !__i18nDict[lang]) return;
    var dict = __i18nDict[lang];
    var nodes = document.querySelectorAll('[data-i18n]');
    for(var i = 0; i < nodes.length; i++){
      var node = nodes[i];
      var key = node.getAttribute('data-i18n');
      if(Object.prototype.hasOwnProperty.call(dict, key)){
        node.textContent = dict[key];
      }
    }
    var placeholderNodes = document.querySelectorAll('[data-i18n-placeholder]');
    for(var j = 0; j < placeholderNodes.length; j++){
      var pNode = placeholderNodes[j];
      var pKey = pNode.getAttribute('data-i18n-placeholder');
      if(Object.prototype.hasOwnProperty.call(dict, pKey)){
        pNode.setAttribute('placeholder', dict[pKey]);
      }
    }
    if(typeof refreshDynamicI18nText === 'function') refreshDynamicI18nText();
  }

  function setLanguage(lang){
    __i18nLang = (lang === 'id') ? 'id' : 'en';
    if(langSwitcher) langSwitcher.checked = (__i18nLang === 'id');
    applyTranslations(__i18nLang);
    saveLang(__i18nLang);
  }

  function initI18n(){
    __i18nLang = getSavedLang();
    if(langSwitcher) langSwitcher.checked = (__i18nLang === 'id');

    try{
      fetch('print-paper-calculation-lang.json')
        .then(function(res){
          if(!res.ok) throw new Error('Failed to load lang.json (status ' + res.status + ')');
          return res.json();
        })
        .then(function(data){
          __i18nDict = data;
          applyTranslations(__i18nLang);
        })
        .catch(function(err){
          console.warn('i18n: lang.json could not be loaded.', err);
        });
    }catch(err){
      console.warn('i18n: fetch is not available in this browser.', err);
    }
  }

  if(langSwitcher){
    langSwitcher.addEventListener('change', function(){
      setLanguage(langSwitcher.checked ? 'id' : 'en');
    });
  }

  initI18n();
})();
</script>
