<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anamaruchi - Tanda Terima Generator</title>
    <link rel="icon" type="image/x-icon" href="https://anamaruchi.github.io/Image/Anamaruchi.ico">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow-x: hidden; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: clamp(20px, 5vh, 60px) 55px;
        }

        .home-button {
	        position: fixed !important;
	        top: clamp(10px, 2vw, 20px) !important;
	        left: clamp(10px, 2vw, 20px) !important;
	        background: linear-gradient(135deg, #0060df, #003eaa);
	        color: white;
	        border: none;
	        padding: clamp(8px, 2vw, 12px);
	        border-radius: 10px;
	        cursor: pointer;
	        transition: background-color 0.3s ease, box-shadow 0.3s ease;
	        box-shadow: 0 5px 15px rgba(0, 96, 223, 0.3);
	        z-index: 100;
	        text-decoration: none;
	        display: inline-flex;
	        align-items: center;
	        justify-content: center;
	        width: clamp(40px, 8vw, 50px);
	        height: clamp(40px, 8vw, 50px);
	        transform: none !important;
            }

        .home-button:hover {
            background: linear-gradient(135deg, #003eaa, #0060df);
            box-shadow: 0 8px 25px rgba(0, 96, 223, 0.4);
            transform: none !important;
            }

        .home-button:active {
	        background: linear-gradient(135deg, #002080, #0060df);
	        box-shadow: 0 4px 15px rgba(0, 96, 223, 0.5);
	        transform: none !important;
            }

        .home-button:focus {
	        outline: 2px solid rgba(255, 255, 255, 0.5);
	        outline-offset: 2px;
	        transform: none !important;
            }

        .home-icon {
            width: clamp(18px, 4vw, 24px);
            height: clamp(18px, 4vw, 24px);
            filter: brightness(0) invert(1);
            transition: none;
            }

        .extension-group {
            position: fixed !important;
            top: clamp(10px, 2vw, 20px) !important;
            right: clamp(10px, 2vw, 30px) !important;
            z-index: 100;
        }

        .extension-button {
            position: relative !important;
            background: linear-gradient(135deg, #0060df, #003eaa);
            color: white;
            border: none;
            padding: clamp(8px, 2vw, 12px);
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 96, 223, 0.3);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: clamp(80px, 15vw, 90px);
            height: clamp(35px, 8vw, 40px);
            transform: none !important;
        }

        .extension-button:hover {
            background: linear-gradient(135deg, #003eaa, #0060df);
            box-shadow: 0 8px 25px rgba(0, 96, 223, 0.4);
            transform: none !important;
        }

        .extension-icon {
            width: clamp(60px, 12vw, 70px);
            height: clamp(28px, 6vw, 32px);
            filter: brightness(0) invert(1);
            transition: none;
            object-fit: contain;
        }

        #ui-panel {
            width: 100%;
            max-width: 800px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9), rgba(45, 45, 45, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 3px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: auto;
        }

        h3 {
            text-align: center;
            grid-column: span 2;
            margin: 0 0 15px 0;
            color: #3b82f6;
            border-bottom: 3px solid rgba(59, 130, 246, 0.5);
            padding-bottom: 15px;
            font-size: 1.8rem;
        }

        .group { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 6px; color: #60a5fa; text-transform: uppercase; letter-spacing: 1px; }

        input, textarea {
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff !important; 
            border: none;
            border-radius: 8px;
            font-size: 14px;
            text-transform: none;
        }

        input::placeholder, textarea::placeholder {
            color: #ffffff !important;
            opacity: 0.8;
        }

        .dropdown-container { position: relative; width: 100%; }

        .dropdown-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: none;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
            font-weight: 500;
            text-transform: capitalize;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background: #2563eb; 
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            max-height: 250px;
            overflow-y: auto;
            border-radius: 12px;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .dropdown-content.show { display: block; }

        .dropdown-content div {
            color: white;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: capitalize;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .dropdown-content div:hover { background: rgba(255, 255, 255, 0.2); padding-left: 20px; }

        .dropdown-arrow {
            width: 0; height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid white;
            transition: 0.3s;
        }

        .dropdown-btn.active .dropdown-arrow { transform: rotate(180deg); }

        .step-box { grid-column: span 2; padding: 15px; border-radius: 12px; margin-bottom: 5px; }
        .step-green { background: rgba(33, 150, 243, 0.1); border-left: 5px solid #2196f3; }
        .step-blue { background: rgba(33, 150, 243, 0.1); border-left: 5px solid #2196f3; }
        
        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 10px;
            background: #ffa500;
            color: black;
            font-weight: bold;
        }

        button:not(.dropdown-btn) {
            grid-column: span 2;
            padding: 15px;
            background: linear-gradient(135deg, #0060df, #003eaa);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 10px;
            font-size: 16px;
        }

        .btn-process {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
            padding: 10px !important;
            font-size: 12px !important;
            margin-top: 10px;
            width: 100%;
        }

        .credit-line {
            grid-column: span 2;
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #fff;
            border-top: 1px solid rgba(59, 130, 246, 0.3);
            padding-top: 15px;
        }
        .credit-line a { color: #60a5fa; text-decoration: none; }

        @media screen and (max-width: 600px) {
            body { 
                padding: 15px;
            }
            #ui-panel { 
                grid-template-columns: 1fr; 
                padding: 15px; 
                gap: 12px;
                border-radius: 20px;
                margin-top: 50px;
            }
            .group, .step-box, button:not(.dropdown-btn), .credit-line, h3 { 
                grid-column: span 1 !important;
            }
            h3 { font-size: 1.3rem; }
            label { font-size: 10px; }
            input, textarea, .dropdown-btn { font-size: 13px; }
            .home-button { width: 45px; height: 45px; top: 15px !important; left: 15px !important; }

            .extension-button {
                top: clamp(10px, 2vw, 15px) !important;
                width: clamp(70px, 13vw, 80px) !important;
                height: clamp(32px, 7vw, 38px) !important;
                padding: clamp(6px, 1.5vw, 10px) !important;
            }

            .extension-icon {
                width: clamp(50px, 10vw, 60px) !important;
                height: clamp(24px, 5vw, 28px) !important;
            }
        }
    </style>
</head>
<body>

<a href="https://anamaruchi.github.io/" class="home-button">
    <img src="https://anamaruchi.github.io/Image/Home Icon.png" alt="Home" class="home-icon" />
</a>

<div class="extension-group">
    <a href="./ALG Invoice Scalper Tanda Terima Extension 1.8.rar" class="extension-button" id="extensionButton">
        <img src="https://anamaruchi.github.io/Image/Download Extension.png" alt="Module" class="extension-icon">
    </a>
</div>

<div id="ui-panel">
    <h3>Tanda Terima & Alamat Generator</h3>
    
    <div class="group step-box step-green">
        <label>Pilih Versi Template Excel: <span id="load-status" class="status-badge">Menghubungkan...</span></label>
        <div class="dropdown-container">
            <button class="dropdown-btn" id="versionBtn">
                <span id="versionLabel">Versi Pendek (4 Baris Barang)</span>
                <span class="dropdown-arrow"></span>
            </button>
            <div id="versionDropdown" class="dropdown-content">
                <div onclick="selectVersion('4', 'Versi Pendek (4 Baris Barang)')">Versi Pendek (4 Baris Barang)</div>
                <div onclick="selectVersion('10', 'Versi Panjang (10 Baris Barang)')">Versi Panjang (10 Baris Barang)</div>
            </div>
            <input type="hidden" id="template-version" value="4">
        </div>
    </div>
    
    <div class="group step-box step-blue">
        <label>Paste Data JSON dari Extension:</label>
        <textarea id="json-input" rows="3" placeholder="Paste kode JSON di sini..."></textarea>
        <button class="btn-process" onclick="parseJsonInput()">Proses Data JSON</button>
    </div>

    <div class="group"><label>Kepada PT/CV</label><input type="text" id="in-penerima"></div>
    <div class="group"><label>Nomor Invoice</label><input type="text" id="in-invoice"></div>
    
    <div class="group" style="grid-column: span 2;">
        <label>Detail Barang (1 Nomer Perbaris)</label>
        <textarea id="in-barang" rows="8" placeholder="Detail barang..."></textarea>
    </div>

    <div class="group"><label>Total Harga</label><input type="number" id="in-harga"></div>
    <div class="group"><label>Tanggal</label><input type="text" id="in-tgl"></div>
    <div class="group" style="grid-column: span 2;"><label>Nama Penyerah</label><input type="text" id="in-user" value="Novia Auni Azalia"></div>
    
    <button onclick="processExcel()" id="downloadBtn">Download Hasil Excel</button>

    <div class="credit-line">
        <b>Created By Anamaruchi (<a href="https://www.facebook.com/anang.zikri.f" target="_blank">Anang Zikri Febriyansyah</a>) | Made With Love for Novia Auni Azalia</b>
    </div>
</div>

<script>
    const versionBtn = document.getElementById('versionBtn');
    const versionDropdown = document.getElementById('versionDropdown');
    const loadStatus = document.getElementById('load-status');

    const files = {
        "4": "Template 4 Baris Barang.xlsx",
        "10": "Template 10 Baris Barang.xlsx"
    };

    let excelBuffer = null;
    let cachedAlamatData = null;

    async function autoFetchTemplate(ver) {
        loadStatus.innerText = "Loading Template...";
        loadStatus.style.background = "#ffa500";
        try {
            const response = await fetch(files[ver]);
            if (!response.ok) throw new Error("Gagal");
            excelBuffer = await response.arrayBuffer();
            loadStatus.innerText = "Template Ready";
            loadStatus.style.background = "#4caf50";
        } catch (err) {
            loadStatus.innerText = "Gagal Load";
            loadStatus.style.background = "#f44336";
        }
    }

    window.onload = () => autoFetchTemplate("10");

    versionBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        versionBtn.classList.toggle('active');
        versionDropdown.classList.toggle('show');
    });

    function selectVersion(val, text) {
        document.getElementById('template-version').value = val;
        document.getElementById('versionLabel').innerText = text;
        versionBtn.classList.remove('active');
        versionDropdown.classList.remove('show');
        autoFetchTemplate(val);
    }

    window.addEventListener('click', () => {
        versionDropdown.classList.remove('show');
    });

    function parseJsonInput() {
        const rawJson = document.getElementById('json-input').value;
        try {
            const data = JSON.parse(rawJson);
            document.getElementById('in-penerima').value = data.customer || "";
            document.getElementById('in-invoice').value = data.invoice_no || "";
            document.getElementById('in-harga').value = data.total_price || 0;
            document.getElementById('in-tgl').value = data.date || "";
            if (data.alamat_data) cachedAlamatData = data.alamat_data;
            if (data.items) {
                document.getElementById('in-barang').value = data.items.map((it, i) => `${i+1}. ${it}`).join("\n\n");
            }
            alert("Data dimuat!");
        } catch (err) { alert("JSON salah!"); }
    }

    async function processExcel() {
        if (!excelBuffer) return alert("Template belum siap!");
        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(excelBuffer);
        const ws = workbook.getWorksheet("Tanda Terima") || workbook.worksheets[0];
        const wsAlamat = workbook.getWorksheet("Alamat");
        const ver = document.getElementById('template-version').value;
        const d = {
            p: document.getElementById('in-penerima').value,
            i: document.getElementById('in-invoice').value,
            h: parseInt(document.getElementById('in-harga').value) || 0,
            t: document.getElementById('in-tgl').value,
            u: document.getElementById('in-user').value,
            it: document.getElementById('in-barang').value.split('\n').filter(l => l.trim() !== "").map(l => l.replace(/^\d+\.\s*/, ""))
        };

        if (ver === "10") {
            ws.getCell('D13').value = d.p; ws.getCell('H28').value = d.i;
            ws.getCell('H29').value = d.h; ws.getCell('B31').value = d.t;
            ws.getCell('K38').value = d.u;
            d.it.forEach((it, i) => { if (i < 10) ws.getCell('H' + (17 + i)).value = it; });
        } else {
            ws.getCell('D13').value = d.p; ws.getCell('H22').value = d.i;
            ws.getCell('H23').value = d.h; ws.getCell('B25').value = d.t;
            ws.getCell('K32').value = d.u;
            d.it.forEach((it, i) => { if (i < 4) ws.getCell('H' + (17 + i)).value = it; });
        }
        if (wsAlamat && cachedAlamatData) {
            cachedAlamatData.forEach(item => { wsAlamat.getCell(item.cell).value = item.value; });
        }
        const buf = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Tanda-Terima-${d.p || 'Print'}.xlsx`;
        a.click();
    }
</script>
</body>
</html>
